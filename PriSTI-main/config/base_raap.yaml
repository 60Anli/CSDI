#type: args

train:
  epochs: 200
  batch_size: 16
  lr: 1.0e-3
  valid_epoch_interval: 5
  is_lr_decay: true

diffusion:
  layers: 4
  channels: 64    #
  nheads: 8
  diffusion_embedding_dim: 128
  beta_start: 0.0001
  beta_end: 0.2
  num_steps: 100
  schedule: "quad"
  is_adp: true
  proj_t: 16
  is_cross_t: true
  is_cross_s: true

model:
  is_unconditional: 0
  timeemb: 128
  featureemb: 16
  target_strategy: "hybrid"
  use_guide: true
  mask_sensor: []

raap:
  enabled: true
  top_k: 5
  bank_size: 2048
  patch_size: 4
  d_model: 128
  n_heads: 4
  num_encoder_layers: 2
  num_decoder_layers: 1
  dropout: 0.1
  use_batch_retrieval_fallback: true
