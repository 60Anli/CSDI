
#type: args

train:
  epochs: 200
  batch_size: 16 
  lr: 1.0e-3
  itr_per_epoch: 1.0e+8


diffusion:
  layers: 4 
  channels: 64 
  nheads: 8
  diffusion_embedding_dim: 128
  beta_start: 0.0001
  beta_end: 0.5
  num_steps: 50
  schedule: "quad"
  is_linear: False

model:
  is_unconditional: 0
  timeemb: 128
  featureemb: 16
  target_strategy: "random"

raap:
  enabled: false
  top_k: 5
  bank_size: 2048
  patch_size: 4
  d_model: 128
  n_heads: 4
  num_encoder_layers: 2
  num_decoder_layers: 1
  dropout: 0.1
  use_batch_retrieval_fallback: true
